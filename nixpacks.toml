[phases.setup]
nixPkgs = ["python3", "gcc"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install -r requirements.txt",
  ". /opt/venv/bin/activate && playwright install --with-deps chromium",
  "if [ -n \"$PRIVATE_REPO_PAT\" ]; then curl -sf -H \"Authorization: token $PRIVATE_REPO_PAT\" -L https://raw.githubusercontent.com/monkrus/agent-a-private/main/readiness/_fixes_private.py -o readiness/_fixes_private.py && echo 'Private fixes installed'; fi"
]

[start]
cmd = "gunicorn readiness.app:app --bind 0.0.0.0:$PORT --timeout 180 --workers 2 --threads 4 --worker-class gthread"
