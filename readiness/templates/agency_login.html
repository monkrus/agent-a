<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agency Login — Agent-A</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .auth-card { max-width: 420px; margin: 4rem auto; }
    .auth-card h2 { text-align: center; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.3rem; }
    .form-group input {
      width: 100%; padding: 0.7rem 0.9rem; font-size: 1rem;
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); outline: none;
    }
    .form-group input:focus { border-color: var(--accent); }
    .auth-submit {
      width: 100%; padding: 0.75rem; font-size: 1rem; font-weight: 600;
      background: var(--accent); color: #fff; border: none; border-radius: 6px;
      cursor: pointer; margin-top: 0.5rem;
    }
    .auth-submit:hover { background: var(--accent-hover); }
    .auth-link { text-align: center; margin-top: 1rem; font-size: 0.9rem; }
    .auth-link a { color: var(--accent); text-decoration: none; }
    .auth-link a:hover { text-decoration: underline; }
    .error-msg { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
      color: var(--red); padding: 0.6rem 0.9rem; border-radius: 6px; margin-bottom: 1rem;
      font-size: 0.9rem; }
  </style>
</head>
<body>
  <nav class="top-nav">
    <div class="nav-inner">
      <div class="nav-links">
        <a href="/" class="nav-brand">Agent&#8209;A</a>
        <a href="/" style="font-size:0.85rem;">Back to scanner</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="card auth-card">
      <h2>Agency Login</h2>
      {% if error %}
      <div class="error-msg">{{ error }}</div>
      {% endif %}
      <form method="post">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autofocus>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="auth-submit">Sign in</button>
      </form>
      <div class="auth-link">
        <p>No account yet? <a href="{{ url_for('agency_register') }}">Create one</a></p>
        <p style="margin-top:0.5rem;">Forgot password? <a href="mailto:sergeigodev@gmail.com?subject=Password%20reset%20request">Contact us</a></p>
      </div>
    </div>
  </div>
</body>
</html>
