# Free agentic-readiness check pack — static-only, no API calls.
#
# 18 checks: the 13 original static checks + 5 static proxies for the
# browser-agent flows. Produces a meaningful score at zero cost.
#
# For full accuracy on interaction/extraction, use shopify-v1.yaml with
# SHOPPER=anthropic (adds 5 shopper + 5 browser checks).
#
# Weights sum to 100.

version: 2026Q3.1-free
pack: shopify-readiness-free

checks:
  # ---- DATA LAYER (7 checks, 37 points) ----
  - id: RDY-001
    type: static
    category: structured-data
    title: Product structured data present with price + availability
    detect: jsonld_product
    expect: A schema.org/Product JSON-LD block with offers.price and availability.
    fail_if: No Product JSON-LD, or price/availability missing.
    weight: 9
    severity_if_fail: critical
    fix: Emit schema.org/Product JSON-LD including offers.price, priceCurrency, and availability.

  - id: RDY-002
    type: static
    category: price-legibility
    title: Price appears in server-rendered HTML (not JS-only)
    detect: price_in_html
    expect: A currency-formatted price string is present in the raw HTML response.
    fail_if: No price string in the server HTML (price injected by client-side JS only).
    weight: 9
    severity_if_fail: critical
    fix: Server-render the price into HTML; agents and crawlers often do not execute JS.

  - id: RDY-003
    type: static
    category: agent-access
    title: Agents are not blocked by robots.txt
    detect: robots_allows_agents
    expect: robots.txt does not Disallow known shopping/agent user-agents from product pages.
    fail_if: robots.txt blocks GPTBot / OAI-SearchBot / Google-Extended / PerplexityBot from this path.
    weight: 5
    severity_if_fail: high
    fix: Allow agent user-agents to read product and policy pages in robots.txt.

  - id: RDY-004
    type: static
    category: policy-legibility
    title: Return / refund policy reachable as text
    detect: policy_text_present
    expect: A return or refund policy is linked and served as readable text.
    fail_if: No discoverable return/refund policy text (missing, or PDF/image only).
    weight: 5
    severity_if_fail: high
    fix: Publish return & shipping policies as plain HTML text with clear, linkable URLs.

  - id: RDY-005
    type: static
    category: agent-access
    title: llms.txt / agent guidance present
    detect: llms_txt_present
    expect: An llms.txt (or equivalent agent-guidance file) exists at the site root.
    fail_if: No llms.txt at the site root.
    weight: 3
    severity_if_fail: low
    fix: Add an llms.txt summarizing product feed location, policies, and contact for agents.

  - id: RDY-012
    type: static
    category: structured-data
    title: JSON-LD Product markup is complete and well-formed
    detect: jsonld_quality
    expect: JSON-LD includes name, image, brand, description, price, currency, and schema.org availability URL.
    fail_if: JSON-LD is missing fields that agents need for accurate product comparison.
    weight: 5
    severity_if_fail: high
    fix: Add missing fields to JSON-LD Product markup (name, image, brand, description, priceCurrency, availability URL).

  - id: RDY-013
    type: static
    category: rendering
    title: Agents can access key product data without JavaScript
    detect: js_render_ratio
    expect: Product price and availability are available in server-rendered HTML or structured data without JS execution.
    fail_if: No structured data fallback and page is heavily JS-rendered.
    weight: 4
    severity_if_fail: high
    fix: Add schema.org/Product JSON-LD with price and availability, or server-render key product content.

  # ---- INTERACTION LAYER (8 checks, 45 points) ----
  - id: RDY-014
    type: static
    category: agent-interaction
    title: Add-to-Cart is a semantic, identifiable action
    detect: cart_semantic
    expect: A form or button with cart/purchase semantics exists in server HTML.
    fail_if: No identifiable Add-to-Cart action in the DOM.
    weight: 5
    severity_if_fail: high
    fix: Use a semantic form with action and a button with clear name/aria-label for Add to Cart.

  - id: RDY-015
    type: static
    category: agent-interaction
    title: Variant selectors (size/color) use semantic HTML
    detect: variant_selectors
    expect: Size and color options use select, radio inputs, or labeled fieldsets.
    fail_if: Variant selection requires interacting with opaque JS widgets.
    weight: 5
    severity_if_fail: medium
    fix: Use select elements or radio inputs with labels for size/color.

  - id: RDY-022
    type: static
    category: agent-checkout
    title: Guest checkout is available (no login wall)
    detect: guest_checkout
    expect: Checkout does not require account creation or login.
    fail_if: Checkout requires login or account creation, blocking agents.
    weight: 4
    severity_if_fail: high
    fix: Enable guest checkout so agents (and customers) can buy without creating an account.

  - id: RDY-023
    type: static
    category: agent-interaction
    title: Programmatic cart API endpoint available
    detect: cart_api
    expect: A /cart/add.js or equivalent AJAX endpoint exists for headless agents.
    fail_if: No cart API endpoint found.
    weight: 4
    severity_if_fail: medium
    fix: Expose a /cart/add.js (Shopify default) or equivalent API endpoint.

  - id: RDY-024
    type: static
    category: agent-interaction
    title: Add-to-Cart flow is agent-friendly (static estimate)
    detect: atc_flow_proxy
    expect: Product page has semantic ATC button, proper variant selectors, and cart API — agents can likely complete a purchase.
    fail_if: Multiple interaction barriers detected (missing ATC form, JS-only selectors, no cart API).
    weight: 7
    severity_if_fail: high
    fix: Use semantic HTML for Add-to-Cart form, standard select elements for variants, and enable /cart/add.js.

  - id: RDY-025
    type: static
    category: agent-search
    title: Site search is accessible to agents
    detect: search_accessible
    expect: Homepage has a search form, search input, or search landmark that agents can use.
    fail_if: No search form or input found on homepage.
    weight: 5
    severity_if_fail: medium
    fix: Add a standard HTML search form or input[type=search] to the homepage.

  - id: RDY-026
    type: static
    category: agent-checkout
    title: Checkout page is reachable
    detect: checkout_proxy
    expect: Checkout page responds and cart/checkout links exist on the product page.
    fail_if: No checkout or cart links found and /checkout not reachable.
    weight: 5
    severity_if_fail: high
    fix: Ensure cart and checkout links are visible in the page HTML.

  - id: RDY-027
    type: static
    category: agent-navigation
    title: Homepage navigation leads to products
    detect: nav_accessible
    expect: Homepage has navigation elements with links to products or collections.
    fail_if: No navigation with product or collection links found on homepage.
    weight: 5
    severity_if_fail: medium
    fix: Use clear nav elements with links to product collections.

  # ---- DISCOVERY LAYER (2 checks, 8 points) ----
  - id: RDY-011
    type: static
    category: agent-access
    title: llms.txt content is complete and well-structured
    detect: llms_txt_quality
    expect: llms.txt contains product paths, policy links, sitemap reference, and valid URLs.
    fail_if: llms.txt is missing key sections.
    weight: 3
    severity_if_fail: medium
    fix: Add product catalog paths, policy links, and sitemap URL to llms.txt.

  - id: RDY-028
    type: static
    category: agent-comparison
    title: Related products section exists
    detect: related_products
    expect: Page has a related/recommended products section with clickable links.
    fail_if: No related products section or product links for comparison.
    weight: 5
    severity_if_fail: medium
    fix: Add a "You may also like" or "Related products" section with product links.

  # ---- SECURITY (1 check, 5 points) ----
  - id: RDY-016
    type: static
    category: security
    title: No hidden prompt injection in page content
    detect: prompt_injection
    expect: Page contains no hidden text designed to hijack AI agent behavior.
    fail_if: Hidden elements, HTML comments, or invisible text contain agent-override instructions.
    weight: 4
    severity_if_fail: critical
    fix: Remove hidden text that contains agent-manipulating instructions.

  # ---- DISCOVERY + RESILIENCE (3 checks, 8 points) ----
  - id: RDY-029
    type: static
    category: agent-discovery
    title: Sitemap.xml exists and lists products
    detect: sitemap_xml
    expect: A valid sitemap.xml exists at the site root, ideally listing product URLs.
    fail_if: No sitemap.xml found — agents cannot discover the product catalog programmatically.
    weight: 3
    severity_if_fail: medium
    fix: Add a sitemap.xml that includes product page URLs so agents and crawlers can discover your catalog.

  - id: RDY-030
    type: static
    category: agent-performance
    title: Page responds within agent timeout threshold
    detect: page_load_time
    expect: Product page responds in under 5 seconds.
    fail_if: Page takes more than 5 seconds to respond — agents with short timeouts will abandon the request.
    weight: 2
    severity_if_fail: medium
    fix: Optimize server response time — reduce blocking resources, enable caching, and consider a CDN.

  - id: RDY-031
    type: static
    category: agent-access
    title: Site does not block agent-like traffic
    detect: rate_limiting
    expect: Site returns HTTP 200 when accessed with a bot-like user-agent (e.g. GPTBot).
    fail_if: Site returns 403 or 429 to agent user-agents — AI shopping agents are actively blocked or rate-limited.
    weight: 3
    severity_if_fail: high
    fix: Allow AI agent user-agents in your WAF/CDN rules. Blocking agents blocks revenue from AI-referred traffic.
